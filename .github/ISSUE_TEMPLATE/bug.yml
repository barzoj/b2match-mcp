name: Bug report
description: Report a problem with b2match-mcp
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste B2match session tokens, cookies, passwords, or Keychain dumps.**
        Redact personal names, emails, phone numbers, and real event identifiers.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what actually happened?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package / commit
      description: npm version or git SHA (not a token)
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "22"
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Use a placeholder event slug such as example-event-2026. Do not include tokens.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I have not included tokens, cookies, or other people's personal data.
          required: true
