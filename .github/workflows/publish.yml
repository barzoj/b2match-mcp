name: Publish to npm

# Manual republish only. Automatic publishes run from release-please.yml
# (a GitHub Release created with GITHUB_TOKEN does not trigger this workflow).
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run prepublishOnly
      - name: Publish
        run: npm publish --provenance --access public
        env:
          # Preferred: npm trusted publishing (OIDC). Fallback: repository secret NPM_TOKEN.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
