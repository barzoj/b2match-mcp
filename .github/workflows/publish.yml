name: Publish to npm

# Manual republish from the default branch tip only.
# Preferred path for tagged releases: workflow_dispatch on release-please.yml
# with publish_tag=vX.Y.Z (npm trusted publisher is bound to that workflow file).
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm --version && node --version
      - run: npm ci
      - run: npm run prepublishOnly
      - name: Skip if version already on npm
        id: published
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Package ${NAME}@${VERSION} already published; skipping npm publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        if: steps.published.outputs.exists != 'true'
        run: |
          unset NODE_AUTH_TOKEN
          npm publish --provenance --access public
