name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "cursor/**"

jobs:
  build-test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Packed CLI smoke on macOS
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          PACK_JSON="$(npm pack --json)"
          TGZ="$(node -e 'let data=""; process.stdin.on("data", c => data += c); process.stdin.on("end", () => console.log(JSON.parse(data)[0].filename));' <<< "$PACK_JSON")"
          TMP_DIR="$(mktemp -d)"
          npx -y "./$TGZ" --help
          B2MATCH_MCP_DISABLE_KEYCHAIN=1 B2MATCH_MCP_CONFIG_DIR="$TMP_DIR" npx -y "./$TGZ" status
